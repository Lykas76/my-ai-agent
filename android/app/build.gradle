plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'local.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'local.assistant'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-MVP'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        buildPython("C:/Users/LykasSV/AppData/Local/Programs/Python/Python313/python.exe")
    }
}
